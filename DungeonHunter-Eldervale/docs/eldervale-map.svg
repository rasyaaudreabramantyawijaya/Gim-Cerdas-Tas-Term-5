<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc">
<title id="title">Eldervale: tiga gerbang dungeon dan empat waypoint</title>
<desc id="desc">Rancangan peta, bukan gameplay. Ashen Crypt di barat, Whispering Grotto di timur, Veyr Sanctum di utara, Hunter Camp di selatan. Jalan menghubungkan lokasi. Teleport hanya ke waypoint yang sudah diaktifkan saat tidak bertarung.</desc>
